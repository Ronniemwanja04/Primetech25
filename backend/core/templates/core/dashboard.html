<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PrimeTech Foundation</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'core/styles/home.css' %}">
</head>
<body>
    <header>
        <!-- Same header as index.html -->
        <div class="container">
            <div class="logo">
                <a href="{% url 'home' %}"><img src="{% static 'core/Photos/logo New.png' %}" alt="Primetech Foundation Logo"></a>
            </div>
            <nav>
                <ul>
                    <li><a href="{% url 'home' %}">Home</a></li>
                    <li><a href="{% url 'about' %}">About Us</a></li>
                    <li><a href="{% url 'courses' %}">Explore Courses</a></li>
                    <li><a href="{% url 'patnership' %}">Partner with us</a></li>
                    <li><a href="{% url 'contact' %}">Contact us</a></li>
                    <li><a href="{% url 'login' %}">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section class="container my-5">
        <h2>Welcome, {{ user.username }}!</h2>
        <p>This is your dashboard. Add your content here.</p>
    </section>
</body>
</html>
